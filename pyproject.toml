[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fireviewer-contracts"
version = "0.1.2"
description = "Versioned evidence and reconstruction contracts and bounded backend clients."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "AGPL-3.0-or-later"
dependencies = [
  "pydantic==2.13.4",
  "pyproj==3.7.2",
  "shapely==2.1.2",
  "httpx==0.28.1"
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff==0.15.21", "jsonschema==4.26.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.txt", "*.md", "py.typed"]

"fireviewer_contracts" = ["schemas/**/*.json", "schemas/**/*.md", "schemas/**/*.sha256"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
